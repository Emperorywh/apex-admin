# SPEC-0001 的静态 OpenAPI 3.1 契约；CI 会校验稳定错误码完整性。
openapi: 3.1.0
info:
  title: Apex Admin IAM API
  version: 1.0.0
servers:
  - url: /
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: 登录并创建独立设备会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功，同时设置 HttpOnly refresh_token Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 轮换 refresh token 并签发新的 access token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 轮换成功并设置新的 refresh_token Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: 幂等撤销 refresh Session
      security: []
      responses:
        '204': { description: 始终清除 refresh_token Cookie }
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: 返回当前数据库用户与 access 授权快照
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/users:
    post:
      tags: [Users]
      summary: 创建后台用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: 用户已创建
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Users]
      summary: 按 createdAt/id 倒序分页查询全局账号目录
      parameters:
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: 查询用户详情
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Users]
      summary: 修改用户角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200':
          description: 修改后用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/users/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: 幂等禁用用户并原子吊销全部活跃 Session
      responses:
        '204': { description: 用户已禁用 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/users/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: 幂等启用用户，不恢复历史 Session
      responses:
        '204': { description: 用户已启用 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/health/live:
    get:
      tags: [Health]
      security: []
      responses:
        '200': { description: 进程存活 }
  /v1/health/ready:
    get:
      tags: [Health]
      security: []
      responses:
        '200': { description: 依赖就绪 }
        '503': { description: 数据库尚未就绪 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
  schemas:
    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, OPERATOR, VIEWER]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    User:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }
        role: { $ref: '#/components/schemas/UserRole' }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, tokenType, expiresIn, user]
          properties:
            accessToken: { type: string }
            tokenType: { const: Bearer }
            expiresIn: { type: integer, minimum: 300, maximum: 86400 }
            user: { $ref: '#/components/schemas/User' }
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, authorization]
          properties:
            user: { $ref: '#/components/schemas/User' }
            authorization:
              type: object
              required: [tokenRole, permissions, expiresAt, stale]
              properties:
                tokenRole: { $ref: '#/components/schemas/UserRole' }
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [user:read, user:create, user:status:change, user:role:assign]
                expiresAt: { type: string, format: date-time }
                stale: { type: boolean }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserPageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta:
          type: object
          required: [nextCursor, hasMore]
          properties:
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - ACCESS_TOKEN_INVALID
        - LOGIN_ACCOUNT_NOT_FOUND
        - INVALID_CREDENTIALS
        - USER_DISABLED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REPLAY
        - REFRESH_TOKEN_STALE
        - INSUFFICIENT_PRIVILEGE
        - USER_NOT_FOUND
        - USER_EMAIL_ALREADY_USED
        - PASSWORD_NOT_ALLOWED
        - LAST_SUPER_ADMIN
        - CONCURRENT_MODIFICATION
        - RATE_LIMIT_EXCEEDED
        - INTERNAL_SERVER_ERROR
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
  responses:
    ValidationFailed:
      description: 字段验证失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: 身份或凭证无效
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Origin 或授权拒绝
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: 用户不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: 唯一性、并发、陈旧 token 或最后超管冲突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unprocessable:
      description: 密码违反安全策略
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: 登录限流或 Argon2 并发队列已满
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
security:
  - bearerAuth: []
