# Apex Admin 唯一受支持的 Nginx 反向代理配置 — SPEC 26.3 / 23.4 / 24.2
#
# 这是 Apex Admin 交付的唯一受支持的 Nginx 配置。
# 不得在部署时添加第二套反向代理配置（SPEC 26.3）。
# nginx -t 验证由 TASK-035 CI 门禁在 Docker 容器内执行，本机无 nginx。
#
# 本文件被 docker-compose 挂载到 /etc/nginx/conf.d/apex.conf，
# 由官方 nginx:stable 镜像的默认 nginx.conf 在 http 块中 include。
#
# 限流规则（SPEC 23.4）:
#   - 登录 POST /api/v1/auth/login  — 每可信客户端 IP 每分钟 10 次
#   - 刷新 POST /api/v1/auth/refresh — 每可信客户端 IP 每分钟 30 次
#
# 超时配置（SPEC 26.3）:
#   - 普通 API  — connect 10s, send 30s, read 30s
#   - 上传请求  — connect 10s, send 120s, read 120s
#   - 下载流式  — connect 10s, send 60s, read 300s
#
# 安全边界:
#   - /metrics 不经 Nginx 对外暴露（SPEC 24.2）
#   - 私有文件禁止由 Nginx 绕过应用授权直接暴露（SPEC 26.3）
#   - 所有 location 仅 proxy_pass 到上游 API，无 root/alias 静态文件直出

# ── 限流区域（SPEC 23.4: 按可信客户端 IP）────────────────────────────────────
# $binary_remote_addr 已由 Nginx 从可信代理链解析为真实客户端 IP。
# 登录: 每分钟 10 次
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
# 刷新: 每分钟 30 次
limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=30r/m;

# ── 上游 API Worker（Docker Compose 内部网络 DNS）────────────────────────────
upstream apex_api {
    server api:8000;
}

# ── HTTP → HTTPS 重定向（SPEC 26.3: HTTPS）────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── HTTPS 反向代理主服务器（SPEC 26.3）────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ── TLS 证书（SPEC 26.3: HTTPS）──────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 安全响应头（SPEC 23.1）────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options       DENY always;
    add_header Referrer-Policy       strict-origin-when-cross-origin always;

    # ── /metrics 不对外暴露（SPEC 24.2）───────────────────────────────────────
    location = /metrics {
        return 404;
    }

    # ── 登录接口限流（SPEC 23.4: 每分钟 10 次）───────────────────────────────
    location = /api/v1/auth/login {
        limit_req       zone=login_limit;
        limit_req_status 429;

        # 普通 API 超时
        client_max_body_size    1m;
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;

        proxy_pass          http://apex_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── 刷新接口限流（SPEC 23.4: 每分钟 30 次）───────────────────────────────
    location = /api/v1/auth/refresh {
        limit_req       zone=refresh_limit;
        limit_req_status 429;

        # 普通 API 超时
        client_max_body_size    1m;
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;

        proxy_pass          http://apex_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── 文件上传（SPEC 26.3: 上传大小限制 + 上传超时）──────────────────────────
    location = /api/v1/files {
        # 上传大小限制（50 MiB，与应用层 MAX_UPLOAD_BODY_SIZE 一致）
        client_max_body_size    50m;

        # 上传超时（允许大文件传输）
        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;

        proxy_pass          http://apex_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── 文件下载流式传输（SPEC 26.3: 下载流式超时）────────────────────────────
    location ~ ^/api/v1/files/[0-9a-fA-F-]+/download$ {
        # 下载流式超时（允许大文件流式传输）
        client_max_body_size    1m;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      300s;

        proxy_pass          http://apex_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── 普通 API 请求（SPEC 26.3: 普通 API 请求超时）──────────────────────────
    location /api/v1/ {
        # 普通请求体大小限制（SPEC 23.1: 限制请求体大小）
        client_max_body_size    1m;

        # 普通 API 超时
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;

        proxy_pass          http://apex_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── 健康检查端点（仅内网监控访问）────────────────────────────────────────
    location /health/ {
        client_max_body_size    1m;
        proxy_connect_timeout   5s;
        proxy_send_timeout      10s;
        proxy_read_timeout      10s;

        proxy_pass          http://apex_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── 默认拒绝（未声明的路径返回 404，不代理到应用）──────────────────────────
    location / {
        return 404;
    }
}
