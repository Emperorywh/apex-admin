# Alembic Configuration - SPEC 8.2
#
# Migration environment uses async PostgreSQL (postgresql+psycopg).
# The actual database URL is loaded from Settings by env.py,
# overriding the placeholder value below.
# version_locations are collected from the module registry by env.py.

[alembic]
# Migration script directory
script_location = alembic

# Database URL placeholder - overridden by env.py from Settings at runtime
sqlalchemy.url = postgresql+psycopg://apex@127.0.0.1:55432/postgres

# Module version_locations are set by env.py from the module registry
# version_locations =

# =====================================================================
# Logging configuration
# =====================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
