# ============================================================================
# Alembic migration configuration (SPEC 8.2)
#
# Database URL is NOT hardcoded here. env.py reads it from Settings
# (SPEC 8.2: migration environment reads DB URL from Settings).
# Migration scripts: src/app/infrastructure/database/migrations/
# ============================================================================

[alembic]
# Migration script directory (relative to project root where this file lives)
script_location = src/app/infrastructure/database/migrations

# Version path separator uses OS default
version_path_separator = os

# Database URL is loaded dynamically by env.py from Settings; left empty here
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Python logging config (applies only during alembic CLI execution,
# independent from the application process logging)
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
