# Alembic Configuration - SPEC 8.2
#
# Migration environment uses async PostgreSQL (postgresql+psycopg).
# The actual database URL is loaded from Settings by env.py,
# overriding the placeholder value below.
# version_locations are collected from the module registry by env.py.

[alembic]
# Migration script directory
script_location = alembic

# Database URL placeholder - overridden by env.py from Settings at runtime
sqlalchemy.url = postgresql+psycopg://apex@127.0.0.1:55432/postgres

# version_locations includes the default versions dir and all enabled
# module migration dirs. Must be declared here because the alembic CLI
# creates ScriptDirectory BEFORE env.py runs; env.py dynamically setting
# version_locations is too late for the CLI path.
# Keep in sync with Composition Root MODULE_VERSION_LOCATIONS.
version_locations = alembic/versions src/app/modules/example/migrations src/app/modules/audit/migrations src/app/modules/identity/migrations

# =====================================================================
# Logging configuration
# =====================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
